<!DOCTYPE html>
<html lang=“ja”>
    <head>
        <meta http-equiv="content-language" content="ja">
        <meta name="robots" content="noindex,nofollow">
        <meta charset="UTF-8">
        <title>タスク一覧</title>
    </head>
    <body>
        <header>
            <button onclick="location.href='./login.html'">ユーザー1(ログアウト)</button>
        </header>
        <h1>タスク一覧</h1>
        <button onclick="location.href='./task-create.html'">新規作成</button>
        <table border="1">
            <!-- <caption>
                タスク表
            </caption> -->
            <thead>
                <tr>
                    <th scope="col">タスクID</th>
                    <th scope="col">タスク名</th>
                    <th scope="col">期日</th>
                    <th scope="col">ステータス</th>                    
                    <th scope="col">編集</th>
                    <th scope="col">削除</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">1</th>
                    <td>サンプルタスク1</td>
                    <td>2026/08/08</td>
                    <td>未対応</td>
                    <td><button onclick="location.href='./task-update.html'">編集</button></td>
                    <td><button command="show-modal" commandfor="my-dialog">削除</button></td>
                </tr>
                <tr>
                    <th scope="row">2</th>
                    <td>サンプルタスク2</td>
                    <td>2026/08/09</td>
                    <td>対応中</td>
                    <td><button onclick="location.href='./task-update.html'">編集</button></td>
                    <td><button command="show-modal" commandfor="my-dialog">削除</button></td>
                </tr>
                <tr>
                    <th scope="row">3</th>
                    <td>サンプルタスク3</td>
                    <td>2026/08/10</td>
                    <td>完了</td>
                    <td><button onclick="location.href='./task-update.html'">編集</button></td>
                    <td><button command="show-modal" commandfor="my-dialog">削除</button></td>
                </tr>                
            </tbody>
        </table>
        <dialog id="my-dialog">
			<p>本当に削除しますか？</p>
			<form action="./task-list.html" method="get" class="form-update">
				<div class="form-delete">
					<input type="button" onclick="location.href='./task-list.html'" value="戻る" />
				</div>
				<div class="form-delete">
					<input type="submit" value="削除" />
				</div>
			</form>
			</dialog>
    </body>
</html>
